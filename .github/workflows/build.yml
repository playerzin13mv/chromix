name: Build Chromix APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Chromix-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK na aba Releases (link direto para baixar no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Chromix.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Chromix.apk \
            --title "Chromix (última versão)" \
            --notes "APK gerado automaticamente. Baixe o Chromix.apk e instale." \
            --prerelease
